name: Throwaway peer view test image

on:
  push:
    branches:
      - throwaway/peer-view-test-image
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: netbird-dashboard:peer-view-663-test
  IMAGE_TAR: netbird-dashboard-peer-view-663-test.tar

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: echo '{}' > .local-config.json

      - name: Download IronRDP release TS files
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          latest: true
          fileName: "*.ts"
          out-file-path: public/ironrdp-pkg

      - name: Download IronRDP release JS files
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          latest: true
          fileName: "*.js"
          out-file-path: public/ironrdp-pkg

      - name: Download IronRDP release WASM file
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          latest: true
          fileName: ironrdp_web_bg.wasm
          out-file-path: public/ironrdp-pkg

      - name: Build dashboard export
        run: npm run build
        env:
          NEXT_PUBLIC_DASHBOARD_VERSION: peer-view-663-test

      - name: Build Docker image archive
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile -t "$IMAGE_TAG" .
          docker save "$IMAGE_TAG" -o "$IMAGE_TAR"
          ls -lh "$IMAGE_TAR"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: netbird-dashboard-peer-view-663-test
          path: ${{ env.IMAGE_TAR }}
          if-no-files-found: error
          retention-days: 7

      - name: Test instructions
        run: |
          {
            echo "## Test image"
            echo
            echo "Artifact: netbird-dashboard-peer-view-663-test"
            echo
            echo '```sh'
            echo "docker load -i $IMAGE_TAR"
            echo "docker run --rm -p 127.0.0.1:8080:80 $IMAGE_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
